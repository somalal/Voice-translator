name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --org com.friends --project-name voice_translator --platforms android build_app

      - name: Add app code and packages
        run: |
          cp lib/main.dart build_app/lib/main.dart
          cd build_app
          flutter pub add speech_to_text flutter_tts translator

      - name: Add Android permissions
        run: |
          python3 - <<'EOF'
          p = "build_app/android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          add = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <queries>\n'
              '        <intent><action android:name="android.speech.RecognitionService"/></intent>\n'
              '        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n'
              '    </queries>\n'
              '    <application'
          )
          s = s.replace("<application", add, 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Build APK
        run: |
          cd build_app
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: voice-translator-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
